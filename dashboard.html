<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - HARSHA PERFECT SOLUTIONS</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="dashboard-container">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar glass">

        <div class="sidebar-header">
            <i class="fas fa-ticket-alt"></i>
            <h2>HARSHA</h2>

            <button class="sidebar-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <nav class="sidebar-nav">

            <!-- MAIN -->
            <div class="nav-section">
                <h3>Main</h3>
                <a href="#dashboard" class="nav-link active">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </a>
            </div>

            <!-- CLIENT -->
            <div class="nav-section client-only" style="display:none;">
                <h3>Client</h3>

                <!-- FIXED LINK -->
                <a href="ticket.html" class="nav-link">
                    <i class="fas fa-plus-circle"></i>
                    <span>Raise Ticket</span>
                </a>

                <a href="#my-tickets" class="nav-link">
                    <i class="fas fa-ticket-alt"></i>
                    <span>My Tickets</span>
                </a>
            </div>

            <!-- DEVELOPER -->
            <div class="nav-section developer-only" style="display:none;">
                <h3>Developer</h3>

                <a href="#assigned-tickets" class="nav-link">
                    <i class="fas fa-tasks"></i>
                    <span>Assigned Tickets</span>
                </a>
            </div>

            <!-- ADMIN -->
            <div class="nav-section admin-only" style="display:none;">
                <h3>Admin</h3>

                <a href="#all-tickets" class="nav-link">
                    <i class="fas fa-list"></i>
                    <span>All Tickets</span>
                </a>

                <a href="#manage-users" class="nav-link">
                    <i class="fas fa-users"></i>
                    <span>Manage Users</span>
                </a>

                <a href="#analytics" class="nav-link">
                    <i class="fas fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
            </div>

            <!-- ACCOUNT -->
            <div class="nav-section">

                <h3>Account</h3>

                <a href="#profile" class="nav-link">
                    <i class="fas fa-user-circle"></i>
                    <span>Profile</span>
                </a>

                <a href="#settings" class="nav-link">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </a>

                <a href="#" class="nav-link" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>

            </div>

        </nav>
    </aside>

    <!-- ================= MAIN ================= -->
    <main class="main-content">

        <!-- TOP BAR -->
        <header class="topbar glass">

            <div class="topbar-left">
                <h1 id="pageTitle">Dashboard</h1>
            </div>

            <div class="topbar-right">

                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search tickets...">
                </div>

                <div class="notification-bell">
                    <i class="fas fa-bell"></i>
                    <span class="badge">3</span>
                </div>

                <div class="user-profile">
                    <img src="https://via.placeholder.com/40" alt="User">
                    <div class="user-info">
                        <p id="userName">User Name</p>
                        <span id="userRole">Role</span>
                    </div>
                </div>

            </div>

        </header>

        <!-- CONTENT -->
        <div class="content">

            <section id="dashboard-section" class="dashboard-section">

                <div class="stats-grid">

                    <div class="stat-card glass">
                        <div class="stat-icon">
                            <i class="fas fa-ticket-alt"></i>
                        </div>
                        <div class="stat-content">
                            <h3>Total Tickets</h3>
                            <p class="stat-number">0</p>
                        </div>
                    </div>

                    <div class="stat-card glass">
                        <div class="stat-icon">
                            <i class="fas fa-hourglass-half"></i>
                        </div>
                        <div class="stat-content">
                            <h3>Open Tickets</h3>
                            <p class="stat-number">0</p>
                        </div>
                    </div>

                    <div class="stat-card glass">
                        <div class="stat-icon">
                            <i class="fas fa-tasks"></i>
                        </div>
                        <div class="stat-content">
                            <h3>In Progress</h3>
                            <p class="stat-number">0</p>
                        </div>
                    </div>

                    <div class="stat-card glass">
                        <div class="stat-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="stat-content">
                            <h3>Resolved</h3>
                            <p class="stat-number">0</p>
                        </div>
                    </div>

                </div>

            </section>

        </div>

    </main>

</div>

<!-- SPINNER -->
<div id="loadingSpinner" class="spinner" style="display:none;">
    <div class="spinner-inner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
